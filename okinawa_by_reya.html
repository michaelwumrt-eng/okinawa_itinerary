<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兩家人的沖繩旅遊 6天手札</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', 'Kosugi Maru', sans-serif;
            background-color: #FFFDF4;
            background-image: radial-gradient(#F7E6C4 1.2px, #FFFDF4 1.2px);
            background-size: 24px 24px;
        }

        .japanese-border {
            border: 3px solid #4A3E3D;
            box-shadow: 4px 4px 0px #4A3E3D;
        }

        .soft-shadow {
            box-shadow: 0 4px 14px rgba(74, 62, 61, 0.08);
        }

        .tab-active {
            background-color: #FF7B89;
            color: white;
            border-color: #4A3E3D;
            transform: translateY(-4px);
            box-shadow: 0 6px 0px #4A3E3D;
        }

        .tab-inactive {
            background-color: #FFF;
            color: #4A3E3D;
            border-color: #4A3E3D;
            box-shadow: 0 3px 0px #4A3E3D;
        }

        .tab-inactive:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0px #4A3E3D;
        }

        .leaflet-container {
            border: 3px solid #4A3E3D;
            border-radius: 1.5rem;
            box-shadow: 4px 4px 0px #4A3E3D;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFFDF4;
        }
        ::-webkit-scrollbar-thumb {
            background: #F7E6C4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFBD59;
        }
    </style>
</head>
<body class="text-[#4A3E3D] pb-12 antialiased">

    <div class="relative overflow-hidden bg-gradient-to-b from-[#A2D2FF] to-[#E8F0FE] border-b-4 border-[#4A3E3D] px-4 py-8 md:py-12">
        <div class="absolute top-4 left-4 text-4xl md:text-5xl opacity-40 animate-bounce"><i class="fa-solid fa-cloud text-white"></i></div>
        <div class="absolute top-8 right-10 text-3xl md:text-4xl opacity-30"><i class="fa-solid fa-plane text-[#FF7B89] -rotate-12"></i></div>
        <div class="absolute bottom-2 left-10 text-5xl md:text-6xl opacity-20 text-[#FFBD59]"><i class="fa-solid fa-umbrella-beach"></i></div>
        <div class="absolute bottom-4 right-6 text-5xl opacity-30 text-[#FF7B89]">🌺</div>

        <div class="max-w-6xl mx-auto text-center relative z-10">
            <div class="inline-flex items-center gap-2 bg-[#FF7B89] text-white px-4 py-1.5 rounded-full font-black text-sm md:text-base border-2 border-[#4A3E3D] shadow-[3px_3px_0px_#4A3E3D] mb-4">
                <i class="fa-solid fa-compass"></i> 沖繩自駕趣
            </div>
            
            <h1 class="text-3xl md:text-5xl lg:text-6xl font-black tracking-wider mb-3 drop-shadow-[2px_2px_0px_rgba(255,255,255,0.8)]">
                兩家人的沖繩旅遊
            </h1>
            <p class="text-base md:text-lg font-bold text-[#557A95] mb-4">
                📅 2026/6/26 - 7/1 ． 美好旅程的開始，一起探索沖繩的陽光與海島風情！
            </p>

            <div class="inline-flex flex-wrap justify-center gap-4 bg-white/90 px-6 py-3 rounded-2xl border-3 border-[#4A3E3D] shadow-[4px_4px_0px_#4A3E3D]">
                <div class="flex items-center gap-2 font-black text-sm md:text-base">
                    <span class="bg-[#FF9F1C] text-white w-7 h-7 flex items-center justify-center rounded-full text-xs">🧑‍🧑‍🧒‍🧒</span>
                    <span>成員：4 大大人 + 1 隻小寶貝</span>
                </div>
                <div class="hidden sm:block text-[#4A3E3D]/30">|</div>
                <div class="flex items-center gap-2 font-black text-sm md:text-base">
                    <span class="bg-[#2EC4B6] text-white w-7 h-7 flex items-center justify-center rounded-full text-xs"><i class="fa-solid fa-car"></i></span>
                    <span>大空間自駕遊 🚗</span>
                </div>
                <div class="hidden sm:block text-[#4A3E3D]/30">|</div>
                <div class="flex items-center gap-2 font-black text-sm md:text-base">
                    <span>🌺</span>
                    <span>沖繩慢活度假風 🏖️</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 md:gap-4">
            <button onclick="switchDay(1)" id="tab-1" class="tab-active transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 1</span>
                <span class="text-base md:text-lg">6/26 (五)</span>
            </button>
            <button onclick="switchDay(2)" id="tab-2" class="tab-inactive transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 2</span>
                <span class="text-base md:text-lg">6/27 (六)</span>
            </button>
            <button onclick="switchDay(3)" id="tab-3" class="tab-inactive transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 3</span>
                <span class="text-base md:text-lg">6/28 (日)</span>
            </button>
            <button onclick="switchDay(4)" id="tab-4" class="tab-inactive transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 4</span>
                <span class="text-base md:text-lg">6/29 (一)</span>
            </button>
            <button onclick="switchDay(5)" id="tab-5" class="tab-inactive transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 5</span>
                <span class="text-base md:text-lg">6/30 (二)</span>
            </button>
            <button onclick="switchDay(6)" id="tab-6" class="tab-inactive transition-all duration-200 py-3 rounded-2xl border-3 font-black text-center flex flex-col items-center justify-center">
                <span class="text-xs uppercase opacity-75">DAY 6</span>
                <span class="text-base md:text-lg">7/1 (三)</span>
            </button>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <div id="day-banner" class="bg-gradient-to-r from-[#FFBD59] to-[#FF9F1C] japanese-border p-6 rounded-3xl mb-8 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden">
            <div class="absolute right-0 bottom-0 opacity-10 text-8xl font-black select-none pointer-events-none" id="bg-big-day">D1</div>
            <div>
                <div class="flex items-center gap-3">
                    <span class="bg-white text-[#FF9F1C] px-3 py-1 rounded-full text-sm font-black border-2 border-[#4A3E3D] shadow-[2px_2px_0px_#4A3E3D]" id="hero-day-num">DAY 1</span>
                    <span class="font-bold text-lg text-white drop-shadow-md" id="hero-date">6/26 (五)</span>
                </div>
                <h2 class="text-2xl md:text-4xl font-black mt-2 drop-shadow-[2px_2px_0px_#4A3E3D]" id="hero-title">抵達沖繩．租車出發！</h2>
                <p class="text-sm font-bold opacity-90 mt-1" id="hero-sub">開啟蔚藍之旅的冒險篇章，期待滿滿！</p>
            </div>
            
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-3 flex items-center gap-2 flex-1 md:flex-none min-w-[120px]">
                    <div class="text-2xl text-white"><i class="fa-solid fa-cloud-sun"></i></div>
                    <div class="text-xs font-bold leading-tight">
                        <div class="opacity-75">平均氣溫</div>
                        <div id="hero-weather">27~31°C</div>
                    </div>
                </div>
                <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-3 flex items-center gap-2 flex-1 md:flex-none min-w-[120px]">
                    <div class="text-2xl text-white"><i class="fa-solid fa-route"></i></div>
                    <div class="text-xs font-bold leading-tight">
                        <div class="opacity-75">本日移動距離</div>
                        <div id="hero-distance">約 31 km</div>
                    </div>
                </div>
                <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-3 flex items-center gap-2 flex-1 md:flex-none min-w-[120px]">
                    <div class="text-2xl text-white"><i class="fa-solid fa-clock"></i></div>
                    <div class="text-xs font-bold leading-tight">
                        <div class="opacity-75">估計車程</div>
                        <div id="hero-drive-time">約 50 分</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-[#FFFDF4] p-6 rounded-3xl border-3 border-[#4A3E3D] shadow-[4px_4px_0px_#4A3E3D]">
                    <div class="flex items-center gap-2 border-b-2 border-[#4A3E3D]/20 pb-4 mb-6">
                        <span class="bg-[#FF7B89] text-white p-2 rounded-xl text-lg border-2 border-[#4A3E3D]
